<section class="page">


<h1>Book Your Dog Grooming</h1>


<form id="bookingForm">


<input id="owner" placeholder="Your Name" required>

<input id="dog" placeholder="Dog Name" required>

<input id="breed" placeholder="Dog Breed" required>



<select id="service">

<option>Bath & Brush - $35</option>
<option>Full Groom - $70</option>
<option>Nail Trim - $15</option>
<option>Puppy Groom - $45</option>

</select>



<input type="date" id="date" required>


<input type="time" id="time" required>


<button class="btn">
Confirm Booking
</button>


</form>


<h2 id="confirmation"></h2>
